const TAG_CLASS = { planets:'tag-planets', deepsky:'tag-deepsky', events:'tag-events', science:'tag-science', history:'tag-history' };
const TAG_LABEL = { planets:'🪐 Planets', deepsky:'🌌 Deep Sky', events:'🌠 Events', science:'🔬 Space Science', history:'📜 History' };

const PER_PAGE = 6;
let currentPage = 1;

function getFilters() {
  const q    = document.getElementById('search-input').value.toLowerCase();
  const sort = document.getElementById('sort-select').value;
  const from = document.getElementById('date-from').value;
  const to   = document.getElementById('date-to').value;
  const cats = [...document.querySelectorAll('#cat-list input:checked')].map(i => i.value);
  return { q, sort, from, to, cats };
}

function applyFilters() {
  const { q, sort, from, to, cats } = getFilters();
  let list = ALL_ARTICLES.filter(a => {
    if (!cats.includes(a.cat)) return false;
    if (q && !a.title.toLowerCase().includes(q) && !a.excerpt.toLowerCase().includes(q)) return false;
    if (from && a.date < from) return false;
    if (to   && a.date > to)   return false;
    return true;
  });
  if (sort === 'newest') list.sort((a,b) => b.date.localeCompare(a.date));
  if (sort === 'oldest') list.sort((a,b) => a.date.localeCompare(b.date));
  if (sort === 'az')     list.sort((a,b) => a.title.localeCompare(b.title));
  if (sort === 'za')     list.sort((a,b) => b.title.localeCompare(a.title));
  return list;
}

function formatDate(d) {
  return new Date(d).toLocaleDateString('en-US', { year:'numeric', month:'short', day:'numeric' });
}

function makeSVG(key) {
  const ns = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('viewBox','0 0 110 90');
  svg.setAttribute('width','110');
  svg.setAttribute('height','90');
  svg.setAttribute('preserveAspectRatio','xMidYMid slice');
  if (THUMBS[key]) THUMBS[key].fn(svg);
  else {
    svg.innerHTML = `<rect width="110" height="90" fill="#e8e4dc"/><circle cx="55" cy="45" r="20" fill="#c8c0b0"/>`;
  }
  return svg;
}

function render() {
  const filtered = applyFilters();
  const total    = filtered.length;
  const pages    = Math.max(1, Math.ceil(total / PER_PAGE));
  if (currentPage > pages) currentPage = 1;

  document.getElementById('results-count').innerHTML =
    `<strong>${total}</strong> article${total !== 1 ? 's' : ''} found`;

  const slice = filtered.slice((currentPage-1)*PER_PAGE, currentPage*PER_PAGE);
  const list  = document.getElementById('article-list');
  list.innerHTML = '';

  if (slice.length === 0) {
    list.innerHTML = `<div class="no-results"><div class="no-results-icon">🔭</div><div class="no-results-text">No articles match your filters.<br>Try adjusting the search or categories.</div></div>`;
  } else {
    slice.forEach(a => {
      const row = document.createElement('div');
      row.className = 'article-row';

      const thumbDiv = document.createElement('div');
      thumbDiv.className = 'article-row-thumb';
      thumbDiv.appendChild(makeSVG(a.thumb));

      const body = document.createElement('div');
      body.className = 'article-row-body';
      body.innerHTML = `
        <div class="article-row-top">
          <span class="tag-pill ${TAG_CLASS[a.cat]}">${TAG_LABEL[a.cat]}</span>
          <span class="article-row-date">${formatDate(a.date)}</span>
        </div>
        <div class="article-row-title">${a.title}</div>
        <div class="article-row-excerpt">${a.excerpt}</div>
        <div class="article-row-meta">
          <span>${a.author}</span>
          <div class="meta-dot"></div>
          <span>${a.read}</span>
        </div>`;

      row.appendChild(thumbDiv);
      row.appendChild(body);
      list.appendChild(row);
    });
  }

  renderPagination(pages);
}

function renderPagination(pages) {
  const pg = document.getElementById('pagination');
  pg.innerHTML = '';
  if (pages <= 1) return;

  const prev = document.createElement('button');
  prev.className = 'page-btn' + (currentPage === 1 ? ' disabled' : '');
  prev.textContent = '← Prev';
  prev.onclick = () => { if (currentPage > 1) { currentPage--; render(); } };
  pg.appendChild(prev);

  for (let i = 1; i <= pages; i++) {
    if (i === 1 || i === pages || Math.abs(i - currentPage) <= 1) {
      const btn = document.createElement('button');
      btn.className = 'page-btn' + (i === currentPage ? ' active' : '');
      btn.textContent = i;
      btn.onclick = (function(p){ return function(){ currentPage = p; render(); }; })(i);
      pg.appendChild(btn);
    } else if (Math.abs(i - currentPage) === 2) {
      const ell = document.createElement('span');
      ell.className = 'page-ellipsis';
      ell.textContent = '…';
      pg.appendChild(ell);
    }
  }

  const next = document.createElement('button');
  next.className = 'page-btn' + (currentPage === pages ? ' disabled' : '');
  next.textContent = 'Next →';
  next.onclick = () => { if (currentPage < pages) { currentPage++; render(); } };
  pg.appendChild(next);
}

document.getElementById('search-input').addEventListener('input',  () => { currentPage=1; render(); });
document.getElementById('sort-select').addEventListener('change',  () => { currentPage=1; render(); });
document.getElementById('date-from').addEventListener('change',    () => { currentPage=1; render(); });
document.getElementById('date-to').addEventListener('change',      () => { currentPage=1; render(); });
document.getElementById('cat-list').addEventListener('change',     () => { currentPage=1; render(); });

document.getElementById('clear-btn').addEventListener('click', () => {
  document.getElementById('search-input').value = '';
  document.getElementById('sort-select').value  = 'newest';
  document.getElementById('date-from').value    = '2024-01-01';
  document.getElementById('date-to').value      = '2026-12-31';
  document.querySelectorAll('#cat-list input').forEach(i => i.checked = true);
  currentPage = 1;
  render();
});

document.querySelectorAll('.view-btn').forEach(b => {
  b.addEventListener('click', function() {
    document.querySelectorAll('.view-btn').forEach(x => x.classList.remove('active'));
    this.classList.add('active');
  });
});

render();
</script>
