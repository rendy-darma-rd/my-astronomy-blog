name: Inject updatedDate on Keystatic saves

on:
  push:
    branches:
      - 'keystatic/**'

jobs:
  inject-updated-date:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Inject updatedDate into changed articles
        run: |
          TODAY=$(date +%Y-%m-%d)
          CHANGED=false

          while IFS= read -r file; do
            if echo "$file" | grep -qE '^src/content/artikel/[^/]+\.mdoc$' && [ -f "$file" ]; then
              if grep -q '^updatedDate:' "$file"; then
                sed -i "s/^updatedDate:.*/updatedDate: $TODAY/" "$file"
              else
                sed -i "/^pubDate:/a updatedDate: $TODAY" "$file"
              fi
              CHANGED=true
            fi
          done < <(git diff --name-only HEAD~1 HEAD)

          if [ "$CHANGED" = true ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add src/content/artikel/
            git commit -m "chore: auto-inject updatedDate [skip ci]"
            git push
          fi
